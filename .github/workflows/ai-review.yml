# AI review inside the pipeline. It reads and comments; it cannot deploy.
# No Salesforce secrets in this job: PR text, comments and code are untrusted input, and a prompt
# injection in them must find nothing worth stealing and nothing it can run against an org.
name: AI review

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Forks get no secrets anyway; say it explicitly rather than rely on it.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # One of the two is set as a repository secret; the other stays empty.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token: no GitHub App install needed, and it can only do what
          # `permissions:` above grants — read code, comment on the PR.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}
            against REVIEW.md. Read CLAUDE.md for conventions. If the PR adds sdlc/GH-<n>/, read
            00-context.md and 10-plan.md there and judge the diff against them.
            Post exactly one comment with gh pr comment, in the format REVIEW.md gives.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
