# AI review inside the pipeline. It reads and comments; it cannot deploy.
# No Salesforce secrets in this job: PR text, comments and code are untrusted input, and a prompt
# injection in them must find nothing worth stealing and nothing it can run against an org.
name: AI review

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Forks get no secrets anyway; say it explicitly rather than rely on it.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read CLAUDE.md for the project's conventions. If the PR adds sdlc/GH-<n>/, read
            00-context.md (acceptance criteria) and 10-plan.md, and judge the diff against them.

            Report only what the automated gates cannot catch: an AC the code does not meet, logic
            that is wrong for a mix of records, a convention from CLAUDE.md broken, a test that
            asserts the implementation instead of the business rule. Every finding cites file:line.
            Code Analyzer, deploy validation and the risk scan already run; do not repeat them.

            Post one PR comment with gh pr comment. If there is nothing to report, say so in one line.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
