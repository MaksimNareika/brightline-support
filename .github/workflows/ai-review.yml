# AI review inside the pipeline. It reads and comments; it cannot deploy.
# No Salesforce secrets in this job: PR text, comments and code are untrusted input, and a prompt
# injection in them must find nothing worth stealing and nothing it can run against an org.
#
# Runs the Claude Code CLI directly, so it works with an AI gateway (base URL + bearer token +
# custom headers) as well as with a plain API key. Set as repository secrets either
#   ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN and, if the gateway needs it, ANTHROPIC_CUSTOM_HEADERS
# or ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN. Secrets are masked in logs: the gateway host
# never appears in this file or in a job log.
name: AI review

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Forks get no secrets anyway; say it explicitly rather than rely on it.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code
      - name: Review against REVIEW.md
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token: it can only do what `permissions:` above grants —
          # read code, comment on the PR.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # An unset secret arrives as an empty string; Claude Code must see it as absent.
          for v in ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_CUSTOM_HEADERS ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN; do
            [ -n "${!v}" ] || unset "$v"
          done
          claude -p "Review pull request #$PR in $REPO against REVIEW.md. Read CLAUDE.md for conventions.
          If the PR adds sdlc/GH-<n>/, read 00-context.md and 10-plan.md there and judge the diff against them.
          Post exactly one comment with gh pr comment, in the format REVIEW.md gives." \
            --model claude-sonnet-5-5 \
            --max-turns 25 \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
