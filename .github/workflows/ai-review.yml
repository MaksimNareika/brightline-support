# AI review inside the pipeline. It reads and comments; it cannot deploy.
# No Salesforce secrets in this job: PR text, comments and code are untrusted input, and a prompt
# injection in them must find nothing worth stealing and nothing it can run against an org.
#
# Claude credentials: one repository secret, CLAUDE_CODE_ENV — a JSON object of the environment
# variables Claude Code needs (setup step 7). Every value is masked in the log before use.
name: AI review

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Forks get no secrets anyway; say it explicitly rather than rely on it.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: this job holds the Claude credentials. Bump deliberately, to a release at least
      # two weeks old.
      - run: npm install --global @anthropic-ai/claude-code@2.1.312
      - name: Review against REVIEW.md
        env:
          CLAUDE_CODE_ENV: ${{ secrets.CLAUDE_CODE_ENV }}
          # The workflow's own token: it can only do what `permissions:` above grants —
          # read code, comment on the PR.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$CLAUDE_CODE_ENV" ] || { echo "secret CLAUDE_CODE_ENV is not set" >&2; exit 1; }
          # Mask every value (each line of it) before anything can print it, then export.
          jq -r '.[] | tostring | split("\n")[] | select(length > 0)' <<<"$CLAUDE_CODE_ENV" |
            while IFS= read -r v; do echo "::add-mask::$v"; done
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | tostring | @sh)"' <<<"$CLAUDE_CODE_ENV")"
          unset CLAUDE_CODE_ENV
          claude -p "Review pull request #$PR in $REPO against REVIEW.md. Read CLAUDE.md for conventions.
          If the PR adds sdlc/GH-<n>/, read 00-context.md and 10-plan.md there and judge the diff against them.
          Post exactly one comment with gh pr comment, in the format REVIEW.md gives." \
            --model claude-sonnet-5-5 \
            --max-turns 25 \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
