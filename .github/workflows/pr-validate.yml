# Quality gates on every PR to test or main. Branch protection makes them required, so a failing
# gate blocks the merge — that is what "guaranteed" means here.
name: PR validate

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @salesforce/cli && npm install
      - name: LWC unit tests
        run: npm run test:unit
      - name: Code Analyzer (fails on severity 1–2)
        run: sf code-analyzer run --workspace force-app --severity-threshold 2 --view table --output-file code-analyzer.html
      - name: Risk scan — hardcoded IDs, weakened tests, permission changes
        run: bash scripts/ci/risk-scan.sh "origin/${{ github.base_ref }}" "${{ join(github.event.pull_request.labels.*.name, ',') }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analyzer
          path: code-analyzer.html

  validate:
    needs: static
    runs-on: ubuntu-latest
    # Environment per target org: holds its own client id, username and key.
    environment: ${{ github.base_ref == 'main' && 'prod' || 'test' }}
    # One validation per org at a time: a Developer Edition org queues deploys.
    concurrency:
      group: validate-${{ github.base_ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @salesforce/cli
      - name: Authenticate as the integration user (JWT)
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          printf '%s' "$SF_JWT_KEY" > server.key
          sf org login jwt --client-id "${{ vars.SF_CLIENT_ID }}" --username "${{ vars.SF_USERNAME }}" \
            --jwt-key-file server.key --instance-url "${{ vars.SF_INSTANCE_URL }}" --alias target
          rm -f server.key
      - name: Validate deploy with local tests
        run: |
          if ! sf project deploy validate --source-dir force-app --target-org target \
               --test-level RunLocalTests --wait 30 --json > validate.json; then
            jq '{message, failures: .result.details.componentFailures, tests: .result.details.runTestResult.failures}' validate.json
            exit 1
          fi
          jq -r '.result.id' validate.json > validated-job-id.txt
          echo "validated job: $(cat validated-job-id.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-job-id
          path: validated-job-id.txt
          retention-days: 10
